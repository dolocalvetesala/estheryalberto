document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ion:column;gap:18px\">\n        <div>\n          <label style=\"display:block;font:400 14px/1 'Patrick Hand SC',cursive;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:7px\">Nombre<\u002Flabel>\n          <input type=\"text\" value=\"{{ f.nombre }}\" sc-camel-on-change=\"{{ setNombre }}\" placeholder=\"Tu nombre\" style=\"width:100%;min-height:48px;background:#FFF9EE;border:1.5px solid rgba(27,63,160,.5);border-radius:10px;padding:13px 14px;font:400 15px/1.2 Archivo,sans-serif;color:#1B3FA0;outline:none\" style-focus=\"border-color:#1B3FA0;box-shadow:0 0 0 3px rgba(27,63,160,.12)\">\n          <sc-if value=\"{{ errNombre }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:6px;font:400 11.5px/1.4 Archivo,sans-serif;color:#B03A2E\">Necesitamos tu nombre.<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div>\n          <label style=\"display:block;font:400 14px/1 'Patrick Hand SC',cursive;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:7px\">Apellidos<\u002Flabel>\n          <input type=\"text\" value=\"{{ f.apellidos }}\" sc-camel-on-change=\"{{ setApellidos }}\" placeholder=\"Tus apellidos\" style=\"width:100%;min-height:48px;background:#FFF9EE;border:1.5px solid rgba(27,63,160,.5);border-radius:10px;padding:13px 14px;font:400 15px/1.2 Archivo,sans-serif;color:#1B3FA0;outline:none\" style-focus=\"border-color:#1B3FA0;box-shadow:0 0 0 3px rgba(27,63,160,.12)\">\n          <sc-if value=\"{{ errApellidos }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:6px;font:400 11.5px/1.4 Archivo,sans-serif;color:#B03A2E\">Necesitamos tus apellidos.<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div>\n          <label style=\"display:block;font:400 14px/1 'Patrick Hand SC',cursive;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:9px\">¿Asistes?<\u002Flabel>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ asistoSi }}\" style=\"{{ asistoSiStyle }}\">SÍ, ALLÍ ESTARÉ<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ asistoNo }}\" style=\"{{ asistoNoStyle }}\">NO PODRÉ<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ errAsisto }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:6px;font:400 11.5px/1.4 Archivo,sans-serif;color:#B03A2E\">Dinos si podrás venir.<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ viene }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <div>\n              <label style=\"display:block;font:400 14px/1 'Patrick Hand SC',cursive;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:9px\">Preboda del viernes 7<\u002Flabel>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ prebodaSi }}\" style=\"{{ prebodaSiStyle }}\">SÍ, ME APUNTO<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ prebodaNo }}\" style=\"{{ prebodaNoStyle }}\">NO PODRÉ<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <label style=\"display:block;font:400 14px/1 'Patrick Hand SC',cursive;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:9px\">Autobús<\u002Flabel>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ busSi }}\" style=\"{{ busSiStyle }}\">SÍ, LO USO<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ busNo }}\" style=\"{{ busNoStyle }}\">VOY POR MI CUENTA<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <label style=\"display:block;font:400 14px/1 'Patrick Hand SC',cursive;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:7px\">Canción que no puede faltar<\u002Flabel>\n              <input type=\"text\" value=\"{{ f.cancion }}\" sc-camel-on-change=\"{{ setCancion }}\" placeholder=\"Título y artista\" style=\"width:100%;min-height:48px;background:#FFF9EE;border:1.5px solid rgba(27,63,160,.5);border-radius:10px;padding:13px 14px;font:400 15px/1.2 Archivo,sans-serif;color:#1B3FA0;outline:none\" style-focus=\"border-color:#1B3FA0;box-shadow:0 0 0 3px rgba(27,63,160,.12)\">\n            <\u002Fdiv>\n\n            <div>\n              <label style=\"display:block;font:400 14px/1 'Patrick Hand SC',cursive;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:7px\">Alérgenos o intolerancias<\u002Flabel>\n              <textarea value=\"{{ f.alergenos }}\" sc-camel-on-change=\"{{ setAlergenos }}\" rows=\"3\" placeholder=\"Cuéntanos qué no puedes comer\" style=\"width:100%;background:#FFF9EE;border:1.5px solid rgba(27,63,160,.5);border-radius:10px;padding:13px 14px;font:400 15px/1.5 Archivo,sans-serif;color:#1B3FA0;outline:none;resize:vertical\" style-focus=\"border-color:#1B3FA0;box-shadow:0 0 0 3px rgba(27,63,160,.12)\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <button type=\"button\" sc-camel-on-click=\"{{ submit }}\" style=\"width:100%;min-height:54px;background:#1B3FA0;color:#F7EFE1;border:none;border-radius:11px;font:400 17px/1 'Patrick Hand SC',cursive;letter-spacing:.18em;cursor:pointer\" style-hover=\"background:#0E2570\">ENVIAR CONFIRMACIÓN<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <div style=\"padding:0 24px 40px;text-align:center\">\n    <div style=\"border-top:1.5px dashed rgba(27,63,160,.35);padding-top:26px\">\n      <div style=\"font:400 22px/1 'Bowlby One SC',cursive;color:transparent;-webkit-text-stroke:1.2px #1B3FA0;white-space:nowrap\">ESTHER Y ALBERTO<\u002Fdiv>\n      <div style=\"font:400 17px/1 'Patrick Hand SC',cursive;letter-spacing:.22em;margin-top:12px\">08.05.27<\u002Fdiv>\n      <div style=\"font:400 13px/1 'Patrick Hand SC',cursive;letter-spacing:.2em;text-transform:uppercase;opacity:.65;margin-top:8px\">Ávila<\u002Fdiv>\n      <div style=\"margin-top:28px;display:flex;align-items:center;justify-content:center;gap:6px;font:400 12.5px/1 'Patrick Hand SC',cursive;letter-spacing:.14em;text-transform:uppercase;opacity:.6\">\n        <span>Hecho con<\u002Fspan>\n        <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:12px;height:12px;flex:none\" fill=\"#1B3FA0\" stroke=\"none\"><path d=\"M12 21 C12 21 3 14.5 3 8.8 A4.8 4.8 0 0 1 12 6.3 A4.8 4.8 0 0 1 21 8.8 C21 14.5 12 21 12 21 Z\"><\u002Fpath><\u002Fsvg>\n        <span>por<\u002Fspan>\n        <a href=\"https://webparabodas.es\" target=\"_blank\" rel=\"noopener\" style=\"color:#1B3FA0;text-decoration:none;border-bottom:1px solid rgba(27,63,160,.4)\">webparabodas.es<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-sticky-cta=\"1\" style=\"position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:20;opacity:0;transform:translateY(16px);transition:opacity .3s ease,transform .3s ease\">\n    <div style=\"width:100%;max-width:440px;padding:14px 20px 18px;background:linear-gradient(to top,#F7EFE1 55%,rgba(247,239,225,0))\">\n      <button type=\"button\" sc-camel-on-click=\"{{ goForm }}\" style=\"width:100%;min-height:52px;background:#1B3FA0;color:#F7EFE1;border:1.5px solid #1B3FA0;border-radius:100px;font:400 17px/1 'Patrick Hand SC',cursive;letter-spacing:.18em;cursor:pointer;box-shadow:0 10px 26px rgba(27,63,160,.26)\" style-hover=\"background:#0E2570\">{{ ctaLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = {\n    now: Date.now(),\n    scrolled: false,\n    copied: false,\n    ibanCopied: false,\n    sent: false,\n    touched: false,\n    f: { nombre: \"\", apellidos: \"\", asisto: null, preboda: null, bus: null, cancion: \"\", alergenos: \"\" }\n  };\n\n  componentDidMount() {\n    this.t = setInterval(() => this.tickDom(), 1000);\n    setTimeout(() => this.setupAnims(), 60);\n    this.ctaSync = () => {\n      const bar = document.querySelector(\"[data-sticky-cta]\");\n      const hero = document.querySelector(\"[data-hero-cta]\");\n      const form = document.getElementById(\"confirmar\");\n      if (!bar || !hero || !form) return;\n      const heroGone = hero.getBoundingClientRect().bottom < 8;\n      const formNear = form.getBoundingClientRect().top < window.innerHeight * 0.75;\n      const show = heroGone && !formNear;\n      bar.style.opacity = show ? \"1\" : \"0\";\n      bar.style.transform = show ? \"none\" : \"translateY(16px)\";\n      bar.style.pointerEvents = show ? \"auto\" : \"none\";\n    };\n    window.addEventListener(\"scroll\", this.ctaSync, { passive: true });\n    window.addEventListener(\"resize\", this.ctaSync);\n    this.ctaSync();\n    try {\n      const s = localStorage.getItem(\"boda-styal-rsvp-v2\");\n      if (s) {\n        const d = JSON.parse(s);\n        if (d && d.sent === true) this.setState({ f: { ...this.state.f, ...d.f }, sent: true });\n      }\n    } catch (e) {}\n  }\n  tickDom() {\n    const cd = this.countdown();\n    Object.keys(cd).forEach(k => {\n      const el = document.querySelector('[data-cd=\"' + k + '\"]');\n      if (el && el.textContent !== String(cd[k])) el.textContent = cd[k];\n    });\n  }\n\n  countdown() {\n    const diff = Math.max(0, new Date(2027, 4, 8, 11, 45, 0).getTime() - Date.now());\n    const pad = n => String(n).padStart(2, \"0\");\n    return {\n      d: String(Math.floor(diff / 86400000)),\n      h: pad(Math.floor(diff / 3600000) % 24),\n      m: pad(Math.floor(diff / 60000) % 60)\n    };\n  }\n\n  componentDidUpdate() { this.setupAnims(); this.tickDom(); if (this.ctaSync) this.ctaSync(); }\n  componentWillUnmount() { clearInterval(this.t); if (this.ctaSync) { window.removeEventListener(\"scroll\", this.ctaSync); window.removeEventListener(\"resize\", this.ctaSync); } if (this.revealCheck) { window.removeEventListener(\"scroll\", this.revealCheck); window.removeEventListener(\"resize\", this.revealCheck); } }\n\n  setupAnims() {\n    const reduce = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    if (reduce) return;\n    const targets = Array.from(document.querySelectorAll(\"[data-anim],[data-draw]\"));\n    targets.forEach(el => {\n      if (el.dataset.animDone || el.dataset.animReady) return;\n      el.dataset.animReady = \"1\";\n      if (el.hasAttribute(\"data-draw\")) {\n        el.querySelectorAll(\"path,circle,line\").forEach(p => {\n          if (p.closest(\"[data-nodraw]\")) return;\n          let len = 0;\n          try { len = p.getTotalLength ? p.getTotalLength() : 0; } catch (e) {}\n          if (!len) return;\n          p.style.setProperty(\"--l\", len);\n          p.style.strokeDasharray = len;\n          p.style.strokeDashoffset = len;\n        });\n      } else {\n        el.style.opacity = \"0\";\n        el.style.transform = \"translateY(14px)\";\n      }\n    });\n    if (!this.revealCheck) {\n      this.revealCheck = () => {\n        const h = window.innerHeight;\n        Array.from(document.querySelectorAll(\"[data-anim],[data-draw]\")).forEach(el => {\n          if (el.dataset.animDone) return;\n          const r = el.getBoundingClientRect();\n          if (r.top > h * 0.92 || r.bottom < 0) return;\n          this.reveal(el);\n        });\n      };\n      window.addEventListener(\"scroll\", this.revealCheck, { passive: true });\n      window.addEventListener(\"resize\", this.revealCheck);\n    }\n    this.revealCheck();\n  }\n\n  reveal(el) {\n        el.dataset.animDone = \"1\";\n        if (el.hasAttribute(\"data-draw\")) {\n          const strokes = Array.from(el.querySelectorAll(\"path,circle,line\")).filter(p => p.style.strokeDasharray);\n          const step = Math.min(40, 1400 / Math.max(1, strokes.length));\n          strokes.forEach((p, i) => {\n            p.style.transition = \"stroke-dashoffset .9s ease-out \" + Math.round(i * step) + \"ms\";\n            requestAnimationFrame(() => { p.style.strokeDashoffset = \"0\"; });\n          });\n        } else {\n          const d = parseInt(el.dataset.delay || \"0\", 10);\n          el.style.transition = \"opacity .7s ease \" + d + \"ms, transform .7s cubic-bezier(.2,.7,.3,1) \" + d + \"ms\";\n          requestAnimationFrame(() => { el.style.opacity = \"1\"; el.style.transform = \"none\"; });\n        }\n  }\n\n  set(k) { return e => this.setState({ f: { ...this.state.f, [k]: e.target.value } }); }\n  pick(k, v) { return () => this.setState({ f: { ...this.state.f, [k]: v } }); }\n\n  pill(active) {\n    return \"min-height:48px;display:grid;place-items:center;text-align:center;border-radius:10px;cursor:pointer;font:400 14px/1.25 'Patrick Hand SC',cursive;letter-spacing:.1em;padding:8px 6px;border:1.5px solid #1B3FA0;\" +\n      (active ? \"background:#1B3FA0;color:#F7EFE1;\" : \"background:#FFF9EE;color:#1B3FA0;\");\n  }\n\n  renderVals() {\n    const f = this.state.f;\n    const cd = this.countdown();\n    const t = this.state.touched;\n\n    return {\n      cd, f, sent: this.state.sent, notSent: !this.state.sent, viene: f.asisto === \"si\",\n      copyLabel: this.state.copied ? \"COPIADO\" : \"COPIAR\",\n      ibanLabel: this.state.ibanCopied ? \"COPIADO\" : \"COPIAR\",\n      copyIban: () => {\n        try { navigator.clipboard.writeText(\"ES6821004471830200571394\"); } catch (e) {}\n        this.setState({ ibanCopied: true });\n        setTimeout(() => this.setState({ ibanCopied: false }), 1800);\n      },\n      copyCode: () => {\n        try { navigator.clipboard.writeText(\"ENLACESTYAL\"); } catch (e) {}\n        this.setState({ copied: true });\n        setTimeout(() => this.setState({ copied: false }), 1800);\n      },\n      setNombre: this.set(\"nombre\"),\n      setApellidos: this.set(\"apellidos\"),\n      setCancion: this.set(\"cancion\"),\n      setAlergenos: this.set(\"alergenos\"),\n      asistoSi: this.pick(\"asisto\", \"si\"),\n      asistoNo: this.pick(\"asisto\", \"no\"),\n      prebodaSi: this.pick(\"preboda\", \"si\"),\n      prebodaNo: this.pick(\"preboda\", \"no\"),\n      prebodaSiStyle: this.pill(f.preboda === \"si\"),\n      prebodaNoStyle: this.pill(f.preboda === \"no\"),\n      busSi: this.pick(\"bus\", \"si\"),\n      busNo: this.pick(\"bus\", \"no\"),\n      asistoSiStyle: this.pill(f.asisto === \"si\"),\n      asistoNoStyle: this.pill(f.asisto === \"no\"),\n      busSiStyle: this.pill(f.bus === \"si\"),\n      busNoStyle: this.pill(f.bus === \"no\"),\n      errNombre: t && !f.nombre.trim(),\n      errApellidos: t && !f.apellidos.trim(),\n      errAsisto: t && !f.asisto,\n      ctaLabel: this.state.sent ? \"RESPUESTA ENVIADA ✓\" : \"CONFIRMAR ASISTENCIA\",\n      successLine: f.asisto === \"no\"\n        ? \"Sentimos que no puedas venir, \" + (f.nombre || \"\") + \". Te echaremos de menos.\"\n        : \"Gracias \" + (f.nombre || \"\") + \". Nos vemos el 8 de mayo en Ávila.\",\n      goTo: e => {\n        e.preventDefault();\n        const id = e.currentTarget.getAttribute(\"href\").slice(1);\n        const el = document.getElementById(id);\n        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 54, behavior: \"smooth\" });\n      },\n      goForm: () => {\n        const el = document.getElementById(\"confirmar\");\n        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 54, behavior: \"smooth\" });\n      },\n      reset: () => this.setState({ sent: false, touched: false, f: { nombre: \"\", apellidos: \"\", asisto: null, preboda: null, bus: null, cancion: \"\", alergenos: \"\" } }),\n      submit: () => {\n        this.setState({ touched: true });\n        if (!f.nombre.trim() || !f.apellidos.trim() || !f.asisto) return;\n        try { localStorage.setItem(\"boda-styal-rsvp-v2\", JSON.stringify({ sent: true, f })); } catch (e) {}\n        try {\n          fetch(\"https://script.google.com/macros/s/AKfycbzQ_37DLY0P3zzBYYyF7s2j9tEq-8maIPd3b7hrke9ue_vJfxWiJwxC7jwd55BCy63k/exec\", {\n            method: \"POST\",\n            mode: \"no-cors\",\n            headers: { \"Content-Type\": \"text/plain;charset=utf-8\" },\n            body: JSON.stringify(f)\n          });\n        } catch (e) {}\n        this.setState({ sent: true, touched: false });\n        window.scrollTo({ top: 0, behavior: \"smooth\" });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
